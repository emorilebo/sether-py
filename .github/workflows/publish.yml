name: Publish

# Publishes to PyPI on every version tag (e.g. v0.1.0) using PyPI Trusted
# Publishing (OIDC) -- no API token stored in the repo. This is the Python
# analog of the TypeScript package's npm provenance publish.
#
# One-time setup (see PUBLISHING.md):
#   PyPI -> your project -> Publishing -> add a "Trusted Publisher":
#     Owner:           raeven-co        (your GitHub org/user)
#     Repository:      sether-py        (the repo holding this package)
#     Workflow name:   publish.yml
#     Environment:     pypi

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password/token: OIDC Trusted Publishing handles auth.
