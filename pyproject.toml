[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sether"
version = "0.3.0"
description = "Streaming PII redaction for AI applications. The hiding place for sensitive data flowing into LLMs. Secrets pack, SSE-aware streaming, audit events, drop-in middlewares for httpx / ASGI / WSGI / OpenAI / Anthropic."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Godfrey Lebo", email = "emorylebo@gmail.com" }]
keywords = [
    "ai", "security", "pii", "redaction", "stream", "sse", "llm", "privacy",
    "gdpr", "hipaa", "compliance", "openai", "anthropic", "secrets",
    "guardrails", "agentic", "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
httpx = ["httpx>=0.27"]
all = ["openai>=1.0", "anthropic>=0.39", "httpx>=0.27"]
dev = ["pytest>=7", "phonenumbers>=8.13", "httpx>=0.27"]

[project.urls]
Homepage = "https://setherai.vercel.app"
Documentation = "https://setherai.vercel.app/docs/python"
Sandbox = "https://setherai.vercel.app/#sandbox"
Repository = "https://github.com/raeven-co/sether"
Issues = "https://github.com/raeven-co/sether/issues"
Changelog = "https://github.com/raeven-co/sether/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sether = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
